name: Sync Book 01 from DEV once

on:
  push:
    paths:
      - '.github/workflows/sync-book01-from-dev-once.yml'

permissions:
  contents: write

jobs:
  sync-book01:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TEST
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone DEV
        run: git clone --depth 1 https://github.com/Valsane-Studio/Chroniques-des-Ages-Dev.git /tmp/dev

      - name: Sync Livre 01 content and assets
        run: |
          rsync -a --delete \
            --exclude='book.js' \
            --exclude='manifest.js' \
            --exclude='dev-page-number.js' \
            /tmp/dev/books/Livre01-La-Grotte-de-Valombre/ \
            books/Livre01-La-Grotte-de-Valombre/

      - name: Commit synchronized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/Livre01-La-Grotte-de-Valombre
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "[book01-sync-done] Sync Livre 01 content from DEV"
            git push
          fi
